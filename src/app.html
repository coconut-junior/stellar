<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      #app-loading {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        color: var(--loading-spinner-color, #4b73ff);
        background: var(--loading-background, oklch(0.145 0 0));
      }

      #app-loading::after {
        content: '';
        width: 1rem;
        height: 1rem;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 9999px;
        animation: app-loading-spin 0.75s linear infinite;
      }

      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      try {
        const primaryColor = localStorage.getItem('stellar-primary-color');
        const darkMode = localStorage.getItem('stellar-dark-mode');
        if (primaryColor && /^#[\da-f]{6}$/i.test(primaryColor)) {
          document.documentElement.style.setProperty('--loading-spinner-color', primaryColor);
        }
        if (darkMode === 'false') {
          document.documentElement.style.setProperty('--loading-background', 'oklch(1 0 0)');
        }
      } catch (error) {
        console.error('Unable to load saved startup theme:', error);
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app-loading" role="status" aria-label="Loading"></div>
    <div id="app-root" style="display: contents">%sveltekit.body%</div>
  </body>
</html>
