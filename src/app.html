<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0a;
      }

      #app-loading {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        color: #fafafa;
      }

      #app-loading::after {
        content: '';
        width: 1rem;
        height: 1rem;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 9999px;
        animation: app-loading-spin 0.75s linear infinite;
      }

      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app-loading" aria-label="Loading"></div>
    <div id="app-root" style="display: contents">%sveltekit.body%</div>
  </body>
</html>
